name: Apply GE360 blocks

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ge360-blocks.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/ge360-blocchi-1-2
          fetch-depth: 0

      - name: Rebuild and apply code-only patch
        shell: bash
        run: |
          set -euo pipefail
          cat .ge360-patch/chunk*.txt | base64 -d | gzip -d > /tmp/ge360-code-only.patch
          git apply --check /tmp/ge360-code-only.patch
          git apply /tmp/ge360-code-only.patch
          git status --short

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Backend compile and unit tests
        working-directory: backend
        run: |
          python -m compileall -q app
          python -m unittest discover -s tests -v

      - name: MCP compile check
        run: |
          if [ -f mcp_server/requirements.txt ]; then
            python -m pip install -r mcp_server/requirements.txt
          fi
          python -m compileall -q mcp_server

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: WordPress tracker syntax checks
        run: |
          php -l wordpress-plugin/ge360-tracker/ge360-tracker.php
          node --check wordpress-plugin/ge360-tracker/tracker.js
          node --check wordpress-plugin/ge360-tracker/web-vitals.attribution.iife.js

      - name: Commit integrated blocks to work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .ge360-patch
          rm -f .github/workflows/apply-ge360-blocks.yml
          git add -A
          git commit -m "feat: integrate GE360 analytics blocks 1-2 [skip ci]"
          git push origin HEAD:work/ge360-blocchi-1-2
