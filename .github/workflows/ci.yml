name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Import FastAPI app
        working-directory: backend
        run: python -c "from app.main import app; print(app.title)"

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP server
        run: pip install -r mcp_server/requirements.txt
      - name: Compile MCP server
        run: python -m compileall -q mcp_server
      - name: Import MCP server
        run: python -c "from mcp_server.server import mcp; print('GE360 MCP ready')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Build dashboard
        working-directory: frontend
        run: npm run build
