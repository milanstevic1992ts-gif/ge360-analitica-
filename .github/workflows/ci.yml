name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Import FastAPI app
        working-directory: backend
        run: python -c "from app.main import app; print(app.title)"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shell launchers
        run: bash -n scripts/run-mcp.sh scripts/setup-chatgpt-plugin.sh
      - name: Validate Agent Plugin manifests
        run: |
          pip install check-jsonschema
          check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json plugin.json
          check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/mcp.schema.json mcp.json

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP server
        run: pip install -r mcp_server/requirements.txt
      - name: Compile MCP server
        run: python -m compileall -q mcp_server
      - name: Import MCP server
        run: python -c "from mcp_server.server import mcp; print('GE360 MCP ready')"

  wordpress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP
        run: php -l wordpress-plugin/ge360-tracker/ge360-tracker.php
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate tracker JavaScript
        run: node --check wordpress-plugin/ge360-tracker/tracker.js

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Build dashboard
        working-directory: frontend
        run: npm run build
