name: Build Linux App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "mcp_server/**"
      - "skills/**"
      - "scripts/build-linux-package.sh"
      - "scripts/run-mcp.sh"
      - "scripts/setup-chatgpt-plugin.sh"
      - "packaging/linux/**"
      - "plugin.json"
      - "mcp.json"
      - ".github/workflows/build-linux.yml"

jobs:
  build-amd64:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build standalone GE360 binary
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name ge360-analitica \
            --paths backend \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            backend/ge360_linux.py

      - name: Smoke test standalone app
        run: |
          export GE360_DB_PATH="$RUNNER_TEMP/ge360.db"
          export GE360_GOOGLE_TOKEN_FILE="$RUNNER_TEMP/google_oauth.json"
          export GE360_FRONTEND_DIR="$GITHUB_WORKSPACE/frontend/dist"
          export GE360_AUTO_SYNC=false
          ./dist/ge360-analitica serve --host 127.0.0.1 --port 18788 >"$RUNNER_TEMP/ge360.log" 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18788/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18788/api/health | grep '"status":"ok"'
          curl -fsS http://127.0.0.1:18788/ | grep -i "GE360 Analitica"

      - name: Build DEB and portable archive
        env:
          GE360_VERSION: "0.2.0"
          GE360_ARCH: amd64
        run: |
          chmod +x scripts/build-linux-package.sh
          scripts/build-linux-package.sh
          dpkg-deb --info dist/ge360-analitica_0.2.0_amd64.deb
          dpkg-deb --contents dist/ge360-analitica_0.2.0_amd64.deb | head -80

      - name: Test DEB install
        run: |
          sudo dpkg -i dist/ge360-analitica_0.2.0_amd64.deb
          /usr/bin/ge360-analitica version
          test -f /etc/ge360-analitica/ge360.env
          test -f /lib/systemd/system/ge360-analitica.service
          test -f /opt/ge360-analitica/www/index.html
          test -f /opt/ge360-analitica/chatgpt-plugin/plugin.json

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ge360-analitica-linux-amd64
          path: |
            dist/ge360-analitica_0.2.0_amd64.deb
            dist/ge360-analitica-linux-amd64-0.2.0.tar.gz
          retention-days: 30
