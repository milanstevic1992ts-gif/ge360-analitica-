name: Build Linux App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/build-linux-package.sh"
      - "packaging/linux/**"
      - ".github/workflows/build-linux.yml"

jobs:
  build-amd64:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Test Meta pagination and compile backend
        run: |
          PYTHONPATH=backend python -m unittest discover -s backend/tests -p 'test_*.py' -v
          python -m compileall -q backend

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Build standalone GE360 binary
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name ge360-analitica \
            --paths backend \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            backend/ge360_linux.py

      - name: Smoke test standalone app
        run: |
          export GE360_DB_PATH="$RUNNER_TEMP/ge360.db"
          export GE360_GOOGLE_TOKEN_FILE="$RUNNER_TEMP/google_oauth.json"
          export GE360_RUNTIME_CONFIG_FILE="$RUNNER_TEMP/runtime_config.json"
          export GE360_FRONTEND_DIR="$GITHUB_WORKSPACE/frontend/dist"
          export GE360_AUTO_SYNC=false
          ./dist/ge360-analitica serve --host 127.0.0.1 --port 18788 >"$RUNNER_TEMP/ge360.log" 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18788/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18788/api/health | grep '"status":"ok"'
          curl -fsS http://127.0.0.1:18788/ | grep -i "GE360 Analitica"
          curl -fsS http://127.0.0.1:18788/api/setup/status | grep '"completion"'

          curl -fsS -X POST http://127.0.0.1:18788/api/setup/google/import-oauth-json \
            -H 'Content-Type: application/json' \
            -d '{"payload":{"web":{"client_id":"imported-client","client_secret":"imported-secret","redirect_uris":["http://127.0.0.1:8788/api/oauth/google/callback"]}}}' \
            | grep '"redirect_ready":true'

          curl -fsS http://127.0.0.1:18788/api/oauth/google/start | grep 'accounts.google.com'

          curl -fsS -X POST http://127.0.0.1:18788/api/setup/meta/credentials \
            -H 'Content-Type: application/json' \
            -d '{"app_id":"meta-sdk-only","app_secret":"","graph_version":"v26.0"}' \
            | tee "$RUNNER_TEMP/meta-sdk.json" \
            | grep '"sdk_ready":true'
          grep '"oauth_ready":false' "$RUNNER_TEMP/meta-sdk.json"

          curl -fsS http://127.0.0.1:18788/api/oauth/meta/config \
            | grep '"app_id":"meta-sdk-only"'

          curl -fsS -X POST http://127.0.0.1:18788/api/setup/system/public-origin \
            -H 'Content-Type: application/json' \
            -d '{"origin":"https://ge360-test.example.ts.net"}' \
            | tee "$RUNNER_TEMP/public-origin.json" \
            | grep '"is_https":true'
          grep 'https://ge360-test.example.ts.net/api/oauth/meta/callback' "$RUNNER_TEMP/public-origin.json"

          curl -fsS -X POST http://127.0.0.1:18788/api/setup/meta/credentials \
            -H 'Content-Type: application/json' \
            -d '{"app_id":"meta-test-app","app_secret":"meta-test-secret","graph_version":"v26.0","redirect_uri":"https://ge360-test.example.ts.net/api/oauth/meta/callback","business_login_config_id":"business-config-test"}' \
            | tee "$RUNNER_TEMP/meta-server-oauth.json" \
            | grep '"oauth_ready":true'
          grep '"business_login_ready":true' "$RUNNER_TEMP/meta-server-oauth.json"
          grep '"login_mode":"facebook_login_for_business"' "$RUNNER_TEMP/meta-server-oauth.json"
          grep 'https://ge360-test.example.ts.net/api/oauth/meta/callback' "$RUNNER_TEMP/meta-server-oauth.json"

          curl -fsS http://127.0.0.1:18788/api/oauth/meta/start \
            | tee "$RUNNER_TEMP/meta-start.json" \
            | grep 'facebook.com'
          grep 'ge360-test.example.ts.net' "$RUNNER_TEMP/meta-start.json"
          grep 'config_id=business-config-test' "$RUNNER_TEMP/meta-start.json"
          if grep -q 'scope=' "$RUNNER_TEMP/meta-start.json"; then
            echo "Business Login must not send legacy scope query parameter"
            exit 1
          fi

          curl -fsS -X POST http://127.0.0.1:18788/api/setup/google             -H 'Content-Type: application/json'             -d '{"client_id":"wizard-test-client","client_secret":"wizard-test-secret","ga4_property_id":"123456789","search_console_site_url":"https://example.com/","business_location_name":"locations/123"}'             | grep '"oauth_ready":true'

          curl -fsS http://127.0.0.1:18788/api/setup/status >"$RUNNER_TEMP/setup-status.json"
          grep 'wizard-test-client' "$RUNNER_TEMP/setup-status.json"
          if grep -q 'wizard-test-secret\|imported-secret\|meta-test-secret' "$RUNNER_TEMP/setup-status.json"; then
            echo "Secret leaked by setup status"
            exit 1
          fi

      - name: Smoke test local Ollama intelligence
        run: |
          python scripts/mock_ollama.py >"$RUNNER_TEMP/mock-ollama.log" 2>&1 &
          OLLAMA_PID=$!
          trap 'kill $OLLAMA_PID 2>/dev/null || true' EXIT

          export GE360_DB_PATH="$RUNNER_TEMP/ge360-ai.db"
          export GE360_GOOGLE_TOKEN_FILE="$RUNNER_TEMP/google_oauth-ai.json"
          export GE360_RUNTIME_CONFIG_FILE="$RUNNER_TEMP/runtime_config-ai.json"
          export GE360_FRONTEND_DIR="$GITHUB_WORKSPACE/frontend/dist"
          export GE360_AUTO_SYNC=false

          ./dist/ge360-analitica serve --host 127.0.0.1 --port 18789 >"$RUNNER_TEMP/ge360-ai.log" 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID $OLLAMA_PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18789/api/local-ai/status >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:18789/api/local-ai/status | grep '"ok":true'
          curl -fsS -X POST http://127.0.0.1:18789/api/local-ai/configure             -H 'Content-Type: application/json'             -d '{"base_url":"http://127.0.0.1:11434","model":"qwen2.5:7b","think":false}'             | grep '"model":"qwen2.5:7b"'

          curl -fsS -X POST http://127.0.0.1:18789/api/local-ai/report             -H 'Content-Type: application/json'             -d '{"days":30,"report_type":"full"}'             | tee "$RUNNER_TEMP/ai-report.json"             | grep '"report_markdown"'

          grep 'Test GE360 Intelligence completato' "$RUNNER_TEMP/ai-report.json"

      - name: Build DEB and portable archive
        env:
          GE360_VERSION: "0.6.3"
          GE360_ARCH: amd64
        run: |
          chmod +x scripts/build-linux-package.sh
          scripts/build-linux-package.sh
          dpkg-deb --info dist/ge360-analitica_0.6.3_amd64.deb
          dpkg-deb --contents dist/ge360-analitica_0.6.3_amd64.deb | head -80

      - name: Test DEB install and in-place upgrade persistence
        run: |
          sudo dpkg -i dist/ge360-analitica_0.6.3_amd64.deb
          /usr/bin/ge360-analitica version
          test -f /etc/ge360-analitica/ge360.env
          test -f /lib/systemd/system/ge360-analitica.service
          test -f /opt/ge360-analitica/www/index.html

          # Simula dati/configurazione/token già presenti prima di un aggiornamento.
          sudo systemctl stop ge360-analitica.service || true
          sudo mkdir -p /var/lib/ge360-analitica/secrets
          echo "# user-setting-must-survive" | sudo tee -a /etc/ge360-analitica/ge360.env >/dev/null
          echo '{"WIZARD_TEST":"survive-upgrade","META_USER_ACCESS_TOKEN":"meta-user-token-survive","META_PAGE_ACCESS_TOKEN":"meta-page-token-survive"}' | sudo tee /var/lib/ge360-analitica/secrets/runtime_config.json >/dev/null
          echo '{"access_token":"google-token-survive","refresh_token":"google-refresh-survive"}' | sudo tee /var/lib/ge360-analitica/secrets/google_oauth.json >/dev/null
          sudo chown ge360:ge360 /var/lib/ge360-analitica/secrets/runtime_config.json /var/lib/ge360-analitica/secrets/google_oauth.json
          sudo chmod 600 /var/lib/ge360-analitica/secrets/runtime_config.json /var/lib/ge360-analitica/secrets/google_oauth.json

          sudo python - <<'PY'
          import sqlite3
          path = "/var/lib/ge360-analitica/ge360.db"
          db = sqlite3.connect(path)
          db.execute("CREATE TABLE IF NOT EXISTS upgrade_persistence_test (marker TEXT NOT NULL)")
          db.execute("DELETE FROM upgrade_persistence_test")
          db.execute("INSERT INTO upgrade_persistence_test(marker) VALUES (?)", ("database-survive-upgrade",))
          db.commit()
          db.close()
          PY
          sudo chown ge360:ge360 /var/lib/ge360-analitica/ge360.db

          # Reinstalla/aggiorna sopra l'installazione esistente.
          sudo dpkg -i dist/ge360-analitica_0.6.3_amd64.deb

          sudo grep "user-setting-must-survive" /etc/ge360-analitica/ge360.env
          sudo grep "survive-upgrade" /var/lib/ge360-analitica/secrets/runtime_config.json
          sudo grep "meta-user-token-survive" /var/lib/ge360-analitica/secrets/runtime_config.json
          sudo grep "meta-page-token-survive" /var/lib/ge360-analitica/secrets/runtime_config.json
          sudo grep "google-token-survive" /var/lib/ge360-analitica/secrets/google_oauth.json
          sudo python - <<'PY' | grep "database-survive-upgrade"
          import sqlite3
          db = sqlite3.connect("/var/lib/ge360-analitica/ge360.db")
          print(db.execute("SELECT marker FROM upgrade_persistence_test LIMIT 1").fetchone()[0])
          db.close()
          PY

      - name: SHA256 Linux package
        run: |
          sha256sum dist/ge360-analitica_0.6.3_amd64.deb | tee dist/ge360-analitica_0.6.3_amd64.deb.sha256

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: ge360-analitica-linux-amd64
          path: |
            dist/ge360-analitica_0.6.3_amd64.deb
            dist/ge360-analitica_0.6.3_amd64.deb.sha256
            dist/ge360-analitica-linux-amd64-0.6.3.tar.gz
          retention-days: 30
